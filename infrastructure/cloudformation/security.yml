AWSTemplateFormatVersion: "2010-09-09"
Description: security infrastructure

Parameters:
  networkstackname:
    Type: String
    Default: goldenowl-network

Resources:
  albsecuritygroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: security group for alb
      VpcId:
        Fn::ImportValue:
          !Sub "${networkstackname}-vpcid"

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: goldenowl-alb-security-group

  ecssecuritygroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: security group for ecs tasks
      VpcId:
        Fn::ImportValue:
          !Sub "${networkstackname}-vpcid"

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref albsecuritygroup

      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: goldenowl-ecs-security-group

Outputs:
  albsecuritygroupid:
    Value: !Ref albsecuritygroup
    Export:
      Name: !Sub "${AWS::StackName}-albsecuritygroupid"

  ecssecuritygroupid:
    Value: !Ref ecssecuritygroup
    Export:
      Name: !Sub "${AWS::StackName}-ecssecuritygroupid"
